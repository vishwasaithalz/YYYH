<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="64" cy="64" r="62" fill="#050811" stroke="url(#cyber-grad)" stroke-width="4" />

  <!-- YinYang Shape -->
  <g filter="url(#glow)">
    <!-- Right curved half -->
    <path d="M 64,4 A 60,60 0 0,1 64,124 A 30,30 0 0,1 64,64 A 30,30 0 0,0 64,4" fill="url(#cyber-grad)" />
    
    <!-- Top Dot (Dark inside Green) -->
    <circle cx="64" cy="34" r="9" fill="#050811" stroke="#10b981" stroke-width="2" />
    
    <!-- Bottom Dot (Light cyan inside Dark) -->
    <circle cx="64" cy="94" r="9" fill="#06b6d4" />

    <!-- Cyber Crosshair Accents -->
    <line x1="64" y1="4" x2="64" y2="14" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="64" y1="114" x2="64" y2="124" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="64" x2="14" y2="64" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="114" y1="64" x2="124" y2="64" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
